<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerajVerse Ludo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #17152b;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    #turn {
      font-size: 20px;
      margin: 15px;
      font-weight: bold;
    }

    .board {
      width: 90vw;
      max-width: 450px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      background: #222;
      padding: 5px;
      border-radius: 12px;
    }

    .cell {
      aspect-ratio: 1;
      background: white;
    }

    .red {
      background: #ef5350;
    }

    .green {
      background: #66bb6a;
    }

    .yellow {
      background: #ffd54f;
    }

    .blue {
      background: #42a5f5;
    }

    .center {
      background: #7e57c2;
    }

    button {
      margin: 15px 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #dice {
      background: white;
      color: #17152b;
    }
  </style>
</head>

<body>

  <h1>🎲 MerajVerse Ludo</h1>

  <div id="turn">Player 1's turn</div>

  <div class="board" id="board"></div>

  <button id="dice">🎲 Roll Dice</button>
  <button onclick="newGame()">New Game</button>

  <script>
    const board = document.getElementById("board");

    function createBoard() {
      board.innerHTML = "";

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {

          const cell = document.createElement("div");
          cell.className = "cell";

          if (row < 6 && col < 6) {
            cell.classList.add("red");
          }

          else if (row < 6 && col > 8) {
            cell.classList.add("green");
          }

          else if (row > 8 && col < 6) {
            cell.classList.add("blue");
          }

          else if (row > 8 && col > 8) {
            cell.classList.add("yellow");
          }

          else if (
            row >= 6 && row <= 8 &&
            col >= 6 && col <= 8
          ) {
            cell.classList.add("center");
          }

          board.appendChild(cell);
        }
      }
    }

    let player = 1;

    document.getElementById("dice").onclick = function() {

      const number = Math.floor(Math.random() * 6) + 1;

      document.getElementById("turn").innerText =
        "Player " + player + " rolled 🎲 " + number;

      player++;

      if (player > 4) {
        player = 1;
      }

      setTimeout(function() {
        document.getElementById("turn").innerText =
          "Player " + player + "'s turn";
      }, 1000);
    };

    function newGame() {
      player = 1;

      document.getElementById("turn").innerText =
        "Player 1's turn";
    }

    createBoard();
  </script>

</body>
</html>
