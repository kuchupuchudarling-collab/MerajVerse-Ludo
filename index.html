<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MerajVerse Ludo</title>

<style>
body{margin:0;background:#17152b;color:white;text-align:center;font-family:Arial}
h1{margin:18px}
#turn{font-size:18px;margin:12px;font-weight:bold}
.board{width:90vw;max-width:420px;margin:auto;display:grid;grid-template-columns:repeat(15,1fr);gap:2px;background:#222;padding:5px}
.cell{aspect-ratio:1;background:white}
.r{background:#ef5350}.g{background:#66bb6a}
.y{background:#ffd54f}.b{background:#42a5f5}
.c{background:#7e57c2}
button{margin:15px 4px;padding:12px 18px;border:0;border-radius:10px;font-size:17px;font-weight:bold}
</style>
</head>

<body>

<h1>🎲 MerajVerse Ludo</h1>
<div id="turn">Player 1's turn</div>
<div class="board" id="board"></div>

<button onclick="roll()">🎲 Roll Dice</button>
<button onclick="newGame()">New Game</button>

<script>
const board=document.getElementById("board");

for(let r=0;r<15;r++){
 for(let c=0;c<15;c++){
  let x=document.createElement("div");
  x.className="cell";

  if(r<6&&c<6)x.classList.add("r");
  else if(r<6&&c>8)x.classList.add("g");
  else if(r>8&&c<6)x.classList.add("b");
  else if(r>8&&c>8)x.classList.add("y");
  else if(r>=6&&r<=8&&c>=6&&c<=8)x.classList.add("c");

  board.appendChild(x);
 }
}

let player=1;

function roll(){
 let n=Math.floor(Math.random()*6)+1;
 document.getElementById("turn").innerText=
 "Player "+player+" rolled 🎲 "+n;

 player++;
 if(player>4)player=1;

 setTimeout(()=>{
  document.getElementById("turn").innerText=
  "Player "+player+"'s turn";
},800);
}
 
function newGame(){
  player=1;
  document.getElementById("turn").innerText="Player 1's turn";
}
</script>

</body>
</html>
