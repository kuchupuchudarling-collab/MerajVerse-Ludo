name: Build MerajVerse Ludo v37 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MerajVerse-Ludo-v37-Proper-Ludo.html'
      - '.github/workflows/build-v37-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/merajverse/ludo app/src/main/res/values
          cp MerajVerse-Ludo-v37-Proper-Ludo.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOG'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='MerajVerseLudo'
          include ':app'
          EOG
          cat > build.gradle <<'EOG'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOG
          cat > app/build.gradle <<'EOG'
          plugins { id 'com.android.application' }
          android { namespace 'com.merajverse.ludo'; compileSdk 35
            defaultConfig { applicationId 'com.merajverse.ludo'; minSdk 23; targetSdk 35; versionCode 37; versionName '3.7' }
          }
          EOG
          cat > app/src/main/java/com/merajverse/ludo/MainActivity.java <<'EOG'
          package com.merajverse.ludo;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); w.setWebViewClient(new WebViewClient()); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); setContentView(w); w.loadUrl("file:///android_asset/index.html");}
          }
          EOG
          cat > app/src/main/AndroidManifest.xml <<'EOG'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="MerajVerse Ludo">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOG
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MerajVerse-Ludo-v37-APK
          path: app/build/outputs/apk/debug/app-debug.apk
