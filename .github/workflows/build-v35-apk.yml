name: Build MerajVerse Ludo v35 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'MerajVerse-Ludo-v35-Proper-Ludo.html'
      - '.github/workflows/build-v35-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/merajverse/ludo
          cp MerajVerse-Ludo-v36-Proper-Ludo.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='MerajVerseLudoV34'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.merajverse.ludo'; compileSdk 35
            defaultConfig { applicationId 'com.merajverse.ludo'; minSdk 23; targetSdk 35; versionCode 35; versionName '3.5' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:theme="@style/AppTheme" android:label="MerajVerse Ludo" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:windowFullscreen">true</item></style></resources>
          EOF
          cat > app/src/main/java/com/merajverse/ludo/MainActivity.java <<'EOF'
          package com.merajverse.ludo;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setMediaPlaybackRequiresUserGesture(false); w.setOverScrollMode(WebView.OVER_SCROLL_NEVER); w.loadUrl("file:///android_asset/index.html"); setContentView(w); }
            @Override public void onBackPressed(){ WebView w=(WebView)findViewById(android.R.id.content); super.onBackPressed(); }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MerajVerse-Ludo-v35-APK
          path: app/build/outputs/apk/debug/app-debug.apk
