name: Build MerajVerse Ludo FINAL v40 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MerajVerse-Ludo-FINAL-ALL-IN-ONE-v40-FINAL.html'
      - '.github/workflows/build-v38-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/merajverse/ludo app/src/main/res/values
          cp MerajVerse-Ludo-FINAL-ALL-IN-ONE-v40-FINAL-1.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOG'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='MerajVerseLudo'
          include ':app'
          EOG

          cat > build.gradle <<'EOG'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOG

          cat > app/build.gradle <<'EOG'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.merajverse.ludo'
            compileSdk 35
            defaultConfig {
              applicationId 'com.merajverse.ludo'
              minSdk 23
              targetSdk 35
              versionCode 40
              versionName '4.0'
            }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.13.0'
          }
          EOG

          cat > app/src/main/java/com/merajverse/ludo/MainActivity.java <<'EOG'
          package com.merajverse.ludo;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
            private static final int MIC_REQ = 7001;
            private WebView webView;

            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              if (android.os.Build.VERSION.SDK_INT >= 23 &&
                  ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_REQ);
              }

              webView = new WebView(this);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);

              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();

              webView.setWebViewClient(new WebViewClientCompat() {
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(
                    WebView view, WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });

              webView.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(() -> {
                    if (request.getOrigin().toString().startsWith("https://appassets.androidplatform.net")) {
                      request.grant(request.getResources());
                    } else {
                      request.deny();
                    }
                  });
                }
              });

              setContentView(webView);
              webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }

            @Override protected void onDestroy() {
              if (webView != null) webView.destroy();
              super.onDestroy();
            }
          }
          EOG

          cat > app/src/main/AndroidManifest.xml <<'EOG'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="MerajVerse Ludo">
              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOG

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Merajverse-Ludo-FINAL-v40-APK
          path: app/build/outputs/apk/debug/app-debug.apk
